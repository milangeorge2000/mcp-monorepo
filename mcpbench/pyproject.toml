[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpbench"
version = "0.1.0"
description = "Benchmark the clients, not the servers. Drives reference MCP agent clients against a standard reference fleet and workload inside a sandbox, scoring conformance, policy respect, tool-call validity, and context economy into an A-F leaderboard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mcpbench contributors" }]
keywords = ["mcp", "agents", "benchmark", "conformance", "evaluation", "model-context-protocol", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/milangeorge2000/mcp-monorepo#mcpbench"
Issues = "https://github.com/milangeorge2000/mcp-monorepo/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mcpbench = "mcpbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"