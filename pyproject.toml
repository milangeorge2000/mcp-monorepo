[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpaudit"
version = "0.1.0"
description = "Report card for your agent's MCP context diet. Measure per-server token waste, find dead tools, export a slimmed config."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mcpaudit contributors" }]
keywords = ["mcp", "model-context-protocol", "agents", "tokens", "observability", "context"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/you/mcpaudit"
Issues = "https://github.com/you/mcpaudit/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mcpaudit = "mcpaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"